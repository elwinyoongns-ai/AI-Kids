{% extends "base.html" %}
{% block title %}编辑 {{ teacher.name }}{% endblock %}
{% block page_title %}编辑教师{% endblock %}
{% block content %}
<div class="page-header">
  <h4>编辑教师</h4>
  <a href="{{ url_for('teachers_list') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>返回</a>
</div>
<div class="row"><div class="col-lg-5">
<div class="stat-card">
<form method="post">
  <div class="mb-3"><label class="form-label fw-semibold">姓名 *</label><input type="text" name="name" class="form-control" value="{{ teacher.name }}" required></div>
  <div class="mb-3"><label class="form-label fw-semibold">电话</label><input type="tel" name="phone" class="form-control" value="{{ teacher.phone or '' }}"></div>
  <div class="mb-3"><label class="form-label fw-semibold">邮箱</label><input type="email" name="email" class="form-control" value="{{ teacher.email or '' }}"></div>
  <div class="mb-3"><label class="form-label fw-semibold">专长领域</label><input type="text" name="specialty" class="form-control" value="{{ teacher.specialty or '' }}"></div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">保存修改</button>
    <a href="{{ url_for('teachers_list') }}" class="btn btn-outline-secondary">取消</a>
  </div>
</form>
</div></div></div>
{% endblock %}
